map $http_origin $companion_api_origin {
    default "";
    "https://www.new-universe.cn" "https://www.new-universe.cn";
}

limit_req_zone $binary_remote_addr zone=study_letter_requests:2m rate=5r/s;

# Only an origin-less safe read from the named site may inherit its HTTPS origin.
# POST always retains the browser's original Origin and is rejected when absent.
map "$request_method:$host:$http_origin" $companion_public_origin {
    default $http_origin;
    "GET:www.new-universe.cn:" "https://www.new-universe.cn";
}

server {
    listen 80;
    listen [::]:80;
    server_name www.new-universe.cn;

    location = /api/v1/public/letters {
        limit_req zone=study_letter_requests burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 24k;
        proxy_pass http://127.0.0.1:3000/v1/public/letters;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 20m;

    # Optional companion module inside the existing Nest process (no extra port).
    location ^~ /api/companion/ {
        # Empty by default: other blog routes still start before companion is enabled.
        # Install exactly one private matching file when deployment is authorized.
        set $companion_proxy_token "";
        include /etc/nginx/snippets/myblog-companion-secret*.conf;
        if ($companion_proxy_token = "") { return 503; }
        if ($host != www.new-universe.cn) { return 403; }
        proxy_pass http://127.0.0.1:3000/v1/public/companion/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Cat-Origin $companion_public_origin;
        proxy_set_header X-Cat-Client-IP $remote_addr;
        proxy_set_header X-Cat-Proxy-Token $companion_proxy_token;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        client_max_body_size 16000;
        client_body_timeout 30s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_cache off;
        gzip off;
    }

    location ^~ /api/study/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ^~ /study-assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.new-universe.cn;

    client_max_body_size 20m;

    location = /v1/public/letters {
        limit_req zone=study_letter_requests burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 24k;
        proxy_pass http://127.0.0.1:3000/v1/public/letters;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v1/public/companion/ { return 403; }

    location ^~ /api/companion/ {
        set $companion_proxy_token "";
        include /etc/nginx/snippets/myblog-companion-secret*.conf;
        if ($companion_proxy_token = "") { return 503; }
        if ($host != api.new-universe.cn) { return 403; }
        if ($companion_api_origin = "") { return 403; }
        if ($http_sec_fetch_site !~ "^(same-site|same-origin|none|)$") { return 403; }
        if ($request_method !~ "^(GET|POST|OPTIONS)$") { return 405; }
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $companion_api_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Vary "Origin" always;
        add_header X-Content-Type-Options nosniff always;
        if ($request_method = OPTIONS) { return 204; }
        # The cross-origin request has already passed the host, origin and metadata checks.
        proxy_set_header Sec-Fetch-Site "";
        proxy_pass http://127.0.0.1:3000/v1/public/companion/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Cat-Origin $companion_api_origin;
        proxy_set_header X-Cat-Client-IP $remote_addr;
        proxy_set_header X-Cat-Proxy-Token $companion_proxy_token;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        client_max_body_size 16000;
        client_body_timeout 30s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_cache off;
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}

server {
    listen 80;
    listen [::]:80;
    server_name badmin.new-universe.cn;

    root /home/myblog/current/admin/dist;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
