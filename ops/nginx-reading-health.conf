# Anonymous per-request timings, restricted to the public blog and its API.
map $host $myblog_health_enabled {
    default 0;
    www.new-universe.cn 1;
    api.new-universe.cn 1;
}
log_format myblog_health '$msec $host $status $request_time';
access_log /var/log/nginx/myblog-health.log myblog_health if=$myblog_health_enabled;
