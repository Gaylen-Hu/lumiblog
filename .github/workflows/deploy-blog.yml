name: Blog frontend release
on:
  pull_request:
    paths:
      - 'apps/blog-web/blog_web/**'
      - 'scripts/*blog*'
      - 'scripts/audit-study-assets.mjs'
      - 'docs/design-draft/V1资产清单.json'
      - '.github/workflows/deploy-blog.yml'
      - 'nginx-blog.conf'
      - 'ops/nginx-myblog.conf'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the tested blog artifact to production (frontend only)'
        type: boolean
        default: false
      deploy_server:
        description: 'Also deploy the compatible search API without database migrations'
        type: boolean
        default: false
      deploy_environment:
        description: 'Release V2 API, additive environment migration and admin with the blog'
        type: boolean
        default: false
      enable_weather:
        description: 'Require fresh weather using configured production QWeather secrets'
        type: boolean
        default: false
      inspect_only:
        description: 'Inspect existing production layout without building or changing it'
        type: boolean
        default: false
      reuse_run_id:
        description: 'Reuse a previous run artifact after verifying its successful build job'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.inspect_only && 'production-inspect' || 'production-deploy' }}
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ !inputs.inspect_only && !inputs.reuse_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: environment_test
          POSTGRES_PASSWORD: environment_test
          POSTGRES_DB: environment_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U environment_test -d environment_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_PUBLIC_SITE_URL: https://www.new-universe.cn
      NEXT_PUBLIC_API_URL: https://api.new-universe.cn/v1/public
      NEXT_PUBLIC_GA_ID: G-Q018EMFR1V
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: '10'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify deployment helpers
        run: |
          node --test scripts/blog-release.test.mjs
          node scripts/audit-study-assets.mjs
          bash -n scripts/deploy-blog.sh
          bash -n scripts/deploy-search-server.sh
          bash -n scripts/deploy-environment.sh
          node --test scripts/environment-release.test.mjs
          node --check scripts/smoke-search.mjs
      - name: Build search API candidate
        if: ${{ inputs.deploy_server || inputs.deploy_environment }}
        working-directory: apps/server/my-blog
        env:
          DATABASE_URL: postgresql://environment_test:environment_test@localhost:5432/environment_test
          ENVIRONMENT_INTEGRATION_URL: postgresql://environment_test:environment_test@localhost:5432/environment_test
          REDIS_INTEGRATION_PORT: '6379'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prisma generate
          pnpm exec jest --runInBand
          pnpm build
          mkdir -p ../../../_artifacts
          tar -czf ../../../_artifacts/server.tar.gz dist prisma package.json pnpm-lock.yaml prisma.config.ts .npmrc scripts/replay-letter-privacy.cjs scripts/prune-letter-tombstones.cjs
      - name: Build V2 administration
        if: ${{ inputs.deploy_environment }}
        working-directory: apps/admin-web/myapp
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit --declaration false
          NODE_OPTIONS="--max-old-space-size=4096" NODE_ENV=production UMI_ENV=prod pnpm build
          tar -czf ../../../_artifacts/admin.tar.gz dist
      - name: Install, test and build blog
        working-directory: apps/blog-web/blog_web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm exec next typegen
          pnpm exec tsc --noEmit
          pnpm exec eslint src/components/study src/app/api src/lib/reading-bookmark.ts
          pnpm build
      - name: Package and run production smoke checks
        run: |
          node scripts/package-blog.mjs apps/blog-web/blog_web _artifacts/blog-release "$GITHUB_SHA"
          cd _artifacts/blog-release
          HOSTNAME=127.0.0.1 PORT=3105 NODE_ENV=production node server.js > ../blog-smoke.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          cd ../..
          READY=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3105/zh >/dev/null; then READY=true; break; fi
            sleep 1
          done
          test "$READY" = true || { cat _artifacts/blog-smoke.log; exit 1; }
          node scripts/smoke-blog.mjs http://127.0.0.1:3105 "$GITHUB_SHA"
          tar -czf _artifacts/blog.tar.gz -C _artifacts/blog-release .
          printf '%s\n' "$GITHUB_SHA" > _artifacts/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: blog-${{ github.sha }}
          path: |
            _artifacts/blog.tar.gz
            _artifacts/revision.txt
            _artifacts/server.tar.gz
            _artifacts/admin.tar.gz
            scripts/deploy-blog.sh
            scripts/patch-blog-nginx.mjs
            scripts/smoke-blog.mjs
            scripts/deploy-search-server.sh
            scripts/smoke-search.mjs
            scripts/deploy-environment.sh
            scripts/prepare-environment-db.mjs
            scripts/environment-release-policy.mjs
            scripts/smoke-environment.mjs
  deploy:
    if: ${{ always() && (inputs.deploy || inputs.inspect_only) && (needs.verify.result == 'success' || inputs.inspect_only || inputs.reuse_run_id) }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        if: ${{ !inputs.inspect_only }}
      - name: Select verified artifact
        if: ${{ !inputs.inspect_only }}
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          SOURCE_RUN="${REUSE_RUN_ID:-$GITHUB_RUN_ID}"
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          if [ -n "$REUSE_RUN_ID" ]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" --jq '[.jobs[] | select(.name == "verify" and .conclusion == "success")] | length')" -gt 0
          fi
          REVISION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.head_sha')"
          ATTEMPT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.run_attempt')"
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          printf 'revision=%s\nrun_id=%s\nattempt=%s\n' "$REVISION" "$SOURCE_RUN" "$ATTEMPT" >> "$GITHUB_OUTPUT"
          node --test scripts/blog-release.test.mjs
          bash -n scripts/deploy-blog.sh
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.inspect_only }}
        with:
          name: blog-${{ steps.candidate.outputs.revision }}
          path: release
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Set up verified SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')" = "$SSH_FINGERPRINT"
      - name: Check existing production layout without changes
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          INSPECT_ONLY: ${{ inputs.inspect_only }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s -- "$INSPECT_ONLY" <<'REMOTE'
            set -eu
            printf 'Remote UID: '; id -u
            node --version
            printf '\nFrontend upload sizes and timestamps:\n'
            find /tmp -maxdepth 2 -type f -path '/tmp/blog-frontend-*/*' -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null || true
            for item in /home/myblog/current/blog /home/myblog/blog-current /root/myblog /etc/nginx/sites-available /etc/nginx/sites-enabled; do
              ls -ld "$item" 2>/dev/null || true
            done
            systemctl show blog-web.service -p User -p WorkingDirectory -p FragmentPath || true
            systemctl show myblog-api.service -p User -p WorkingDirectory -p FragmentPath || true
            systemctl is-active blog-web.service myblog-api.service nginx.service || true
            printf '\nNginx site names and upstreams:\n'
            nginx -T 2>/dev/null | awk '/^# configuration file / || /^[[:space:]]*(server_name|listen|proxy_pass|root)[[:space:]]/ {print}' || true
            printf '\nDatabase backup tooling:\n'
            command -v pg_dump || true
            command -v pg_restore || true
            node --input-type=module <<'PREFLIGHT'
          import fs from 'node:fs';
          import {parseEnv} from 'node:util';
          import {createRequire} from 'node:module';
          const current=fs.realpathSync('/home/myblog/server-current');
          const require=createRequire(current+'/package.json');
          const {PrismaClient}=require('@prisma/client');
          const config=parseEnv(fs.readFileSync('/home/myblog/apps/.env','utf8'));
          const db=new PrismaClient({datasources:{db:{url:config.DATABASE_URL}}});
          try {
            const history=await db.$queryRawUnsafe('SELECT migration_name, finished_at, rolled_back_at FROM "_prisma_migrations"');
            const applied=new Set(history.filter(x=>x.finished_at&&!x.rolled_back_at).map(x=>x.migration_name));
            const existing=fs.readdirSync(current+'/prisma/migrations',{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name);
            console.log(JSON.stringify({appliedMigrations:applied.size,unresolvedMigrations:history.filter(x=>!x.finished_at&&!x.rolled_back_at).length,pendingExisting:existing.filter(x=>!applied.has(x)),environmentApplied:applied.has('20261105140000_environment_config')}));
          } catch {console.log('Migration preflight unavailable; inspect privately before release');}
          finally {await db.$disconnect();}
          PREFLIGHT
            if [ "$1" = true ]; then exit 0; fi
            test "$(id -u)" = 0
            test -d /home/myblog/current/blog
            test -f /etc/nginx/sites-enabled/myblog.conf
            systemctl is-active --quiet blog-web.service
            systemctl is-active --quiet nginx.service
            systemctl show blog-web.service -p User -p WorkingDirectory -p FragmentPath
            node --version
            nginx -t
            curl -fsS --max-time 30 http://127.0.0.1:3001/zh >/dev/null
            df -h /home/myblog
          REMOTE
      - name: Upload and deploy selected services
        if: ${{ !inputs.inspect_only }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SOURCE_RUN: ${{ steps.candidate.outputs.run_id }}
          SOURCE_ATTEMPT: ${{ steps.candidate.outputs.attempt }}
          DEPLOY_SERVER: ${{ inputs.deploy_server }}
          DEPLOY_ENVIRONMENT: ${{ inputs.deploy_environment }}
          REQUIRE_WEATHER: ${{ inputs.enable_weather }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
        run: |
          REMOTE="/tmp/blog-frontend-$SOURCE_RUN-$SOURCE_ATTEMPT"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "install -d -m 0700 '$REMOTE'"
          LOCAL_HASH="$(sha256sum release/_artifacts/blog.tar.gz | awk '{print $1}')"
          REMOTE_HASH="$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "if test -f '$REMOTE/blog.tar.gz'; then sha256sum '$REMOTE/blog.tar.gz' | cut -d' ' -f1; fi")"
          if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
            scp -i ~/.ssh/deploy_key -P "$SSH_PORT" release/_artifacts/blog.tar.gz "$SSH_USER@$SSH_HOST:$REMOTE/"
          else
            printf 'Reusing identical uploaded archive (SHA-256 verified)\n'
          fi
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" release/_artifacts/revision.txt scripts/patch-blog-nginx.mjs scripts/smoke-blog.mjs scripts/deploy-blog.sh "$SSH_USER@$SSH_HOST:$REMOTE/"
          if [ "$DEPLOY_ENVIRONMENT" = true ]; then
            test -f release/_artifacts/server.tar.gz
            test -f release/_artifacts/admin.tar.gz
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const enabled = process.env.REQUIRE_WEATHER === 'true';
          const host = enabled ? process.env.QWEATHER_API_HOST : '';
          const key = enabled ? process.env.QWEATHER_API_KEY : '';
          if (enabled && (!/^[a-z0-9-]+\.[a-z0-9-]+\.qweatherapi\.com$/i.test(host || '') || !/^[a-z0-9_-]+$/i.test(key || ''))) throw Error('Production weather secrets are missing or invalid');
          fs.writeFileSync('weather.env', `QWEATHER_API_HOST=${host}\nQWEATHER_API_KEY=${key}\nWEATHER_MULTI_INSTANCE=true\n`, {mode:0o600});
          NODE
            scp -i ~/.ssh/deploy_key -P "$SSH_PORT" release/_artifacts/server.tar.gz release/_artifacts/admin.tar.gz scripts/deploy-environment.sh scripts/prepare-environment-db.mjs scripts/environment-release-policy.mjs scripts/smoke-environment.mjs scripts/smoke-search.mjs weather.env "$SSH_USER@$SSH_HOST:$REMOTE/"
            rm -f -- weather.env
            ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "trap 'rm -f -- $REMOTE/weather.env' EXIT; ARTIFACTS_DIR='$REMOTE' REQUIRE_WEATHER='$REQUIRE_WEATHER' bash '$REMOTE/deploy-environment.sh'"
          elif [ "$DEPLOY_SERVER" = true ]; then
            test -f release/_artifacts/server.tar.gz
            scp -i ~/.ssh/deploy_key -P "$SSH_PORT" release/_artifacts/server.tar.gz scripts/deploy-search-server.sh scripts/smoke-search.mjs "$SSH_USER@$SSH_HOST:$REMOTE/"
            ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "ARTIFACTS_DIR='$REMOTE' bash '$REMOTE/deploy-search-server.sh'"
          fi
          if [ "$DEPLOY_ENVIRONMENT" != true ]; then
            ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "ARTIFACTS_DIR='$REMOTE' bash '$REMOTE/deploy-blog.sh'"
          fi
